<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsychBright · Collections Sync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Fix: define all functions immediately in global scope
window.handleDragOver = function(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); };
window.handleDragLeave = function(e) { document.getElementById('drop-zone').classList.remove('drag-over'); };
window.handleDrop = function(e) { e.preventDefault(); document.getElementById('drop-zone').classList.remove('drag-over'); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); };
window.handleFileSelect = function(e) { if (e.target.files[0]) processFile(e.target.files[0]); };
</script>
